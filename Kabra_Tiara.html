<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kabra Tiara</title>

  <style>
    df-messenger {
      --df-messenger-primary-color: red; /* ✅ THIS controls header in ES */
      --df-messenger-background-color: red;
    }

    /* Header layout */
    df-messenger::part(titlebar) {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    df-messenger::part(title) {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white; /* make text visible on red */
    }

    /* Logo before title */
    df-messenger::part(title)::before {
      content: "";
      display: inline-block;
      width: 28px;
      height: 28px;
      background-image: url('https://vectorjungal.com/files/preview/960x960/11723056345mhq9h5tfdzeentbyedqxsvgp3s3ujbj7exncjcok6k0eclkuslsykwbgk5gjz1zlyoqahlakgvhrswfyaj4dr8m3mugtewmjqbvf.png');
      background-size: cover;
      background-position: center;
      border-radius: 50%;
    }
  </style>

  <!-- Load script AFTER styles -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
</head>

<body>
  <df-messenger
    chat-title="Kabra‎‎_Tiara"
    agent-id="a73f29c6-f0ae-4859-838f-47e968b67f07"
    language-code="en">
  </df-messenger>
</body>
</html>
